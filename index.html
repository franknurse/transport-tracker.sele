<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#185fa5" id="theme-meta" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Transport Tracker" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Transport Tracker</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1f1f1d;
    --text-secondary: #6b6a63;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --danger: #c0392b;
    --success: #27ae60;
  }
  .dark {
    --bg: #121212;
    --card: #1e1e1e;
    --border: #333333;
    --text: #e8e8e8;
    --text-secondary: #999999;
    --accent: #4a9eff;
    --accent-bg: #1a3a5c;
    --danger: #e74c3c;
    --success: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    transition: background 0.2s, color 0.2s;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    text-align: center;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    position: relative;
  }
  .top-bar h1 {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .view-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .view-tab {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    text-align: center;
  }
  .view-tab.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
  }
  .month-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .month-row button {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
  }
  .month-label {
    font-size: 16px;
    font-weight: 600;
  }
  .rate-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .rate-row label {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .rate-row input {
    flex: 1;
    border: none;
    font-size: 16px;
    text-align: right;
    background: transparent;
    color: var(--text);
  }
  .rate-row input:focus { outline: none; }
  .dow-row, .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .dow-row { margin-bottom: 6px; }
  .dow-row div {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .grid { margin-bottom: 20px; }
  .day-btn {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.05s;
  }
  .day-btn:active { transform: scale(0.95); }
  .day-btn.marked {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .day-btn.empty {
    border: none;
    background: transparent;
    cursor: default;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .stat-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 600;
  }
  .footer-note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1.5;
  }
  .install-banner {
    display: none;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .install-banner.show { display: flex; }
  .install-banner span { font-size: 14px; font-weight: 500; }
  .install-banner button {
    background: #fff;
    color: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .install-banner .dismiss {
    background: transparent;
    color: rgba(255,255,255,0.7);
    padding: 4px;
    font-size: 18px;
    line-height: 1;
  }

  /* Summary view */
  .summary-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .summary-table th, .summary-table td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .summary-table th {
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
  }
  .summary-table td { color: var(--text); }
  .summary-table tr:last-child td { border-bottom: none; }
  .summary-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .summary-total {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .summary-total .label { font-size: 14px; color: var(--text-secondary); }
  .summary-total .value { font-size: 24px; font-weight: 700; color: var(--accent); }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
    font-size: 14px;
  }
  .action-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .action-btn {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .action-btn.secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* Print styles */
  @media print {
    body { background: #fff; color: #000; max-width: 100%; padding: 20px; }
    .no-print, .install-banner, .view-tabs, .top-bar, .month-row, .rate-row, .dow-row, .grid, .stats, .footer-note, .action-row { display: none !important; }
    .print-only { display: block !important; }
    .print-header { text-align: center; margin-bottom: 30px; }
    .print-header h2 { margin: 0 0 6px; font-size: 22px; }
    .print-header p { margin: 0; color: #555; font-size: 14px; }
    .print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
    .print-table th, .print-table td { padding: 10px 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .print-table th { background: #f0f0f0; font-weight: 600; }
    .print-table .num { text-align: right; }
    .print-total { text-align: right; font-size: 18px; font-weight: 700; margin-top: 20px; padding-top: 10px; border-top: 2px solid #000; }
    .print-footer { margin-top: 40px; font-size: 12px; color: #777; text-align: center; }
  }
  .print-only { display: none; }
</style>
</head>
<body>

<div class="top-bar no-print">
  <button class="icon-btn" id="theme-toggle" title="Toggle dark mode">&#9788;</button>
  <h1>Transport tracker</h1>
  <button class="icon-btn" id="export-btn" title="Export / Print">&#128424;</button>
</div>

<div class="install-banner no-print" id="install-banner">
  <span>Add to home screen for quick access</span>
  <div style="display:flex;gap:6px;align-items:center;">
    <button id="install-btn">Install</button>
    <button class="dismiss" id="dismiss-install">&times;</button>
  </div>
</div>

<div class="view-tabs no-print" id="view-tabs">
  <div class="view-tab active" data-view="tracker">Tracker</div>
  <div class="view-tab" data-view="summary">Summary</div>
</div>

<!-- TRACKER VIEW -->
<div id="tracker-view">
  <div class="month-row no-print">
    <button id="prev-month" aria-label="Previous month">&#8592;</button>
    <div class="month-label" id="month-label"></div>
    <button id="next-month" aria-label="Next month">&#8594;</button>
  </div>

  <div class="rate-row no-print">
    <label for="rate">Daily rate (TZS)</label>
    <input type="number" id="rate" min="0" step="500" value="2000" />
  </div>

  <div class="dow-row no-print">
    <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
  </div>
  <div class="grid no-print" id="grid"></div>

  <div class="stats no-print">
    <div class="stat-card">
      <div class="stat-label">Days marked</div>
      <div class="stat-value" id="days-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total owed</div>
      <div class="stat-value" id="total">0</div>
    </div>
  </div>
</div>

<!-- SUMMARY VIEW -->
<div id="summary-view" style="display:none;">
  <div class="action-row no-print">
    <button class="action-btn secondary" id="clear-all-btn">Clear All Data</button>
    <button class="action-btn" id="print-summary-btn">Print / Save PDF</button>
  </div>
  <div id="summary-content"></div>
</div>

<!-- PRINT-ONLY REPORT -->
<div class="print-only" id="print-report">
  <div class="print-header">
    <h2>Transport Tracker Report</h2>
    <p id="print-date"></p>
  </div>
  <table class="print-table" id="print-table">
    <thead>
      <tr><th>Month</th><th>Rate (TZS)</th><th class="num">Days</th><th class="num">Total (TZS)</th></tr>
    </thead>
    <tbody id="print-tbody"></tbody>
  </table>
  <div class="print-total" id="print-total"></div>
  <div class="print-footer">Generated from Transport Tracker</div>
</div>

<div class="footer-note no-print">
  Data is saved on this device only.<br />
  Tap a day to mark or unmark it. Works offline.
</div>

<script>
let current = new Date();
current.setDate(1);
let marked = {};
const rateInput = document.getElementById('rate');
let currentView = 'tracker';

function storageKey(d) {
  return 'transport-' + d.getFullYear() + '-' + (d.getMonth() + 1);
}

function loadMonth() {
  const key = storageKey(current);
  let data = { days: [], rate: 2000 };
  try {
    const raw = localStorage.getItem(key);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  marked = {};
  (data.days || []).forEach(d => marked[d] = true);
  rateInput.value = data.rate || 2000;
  render();
}

function saveMonth() {
  const key = storageKey(current);
  const days = Object.keys(marked).filter(k => marked[k]).map(Number);
  const data = { days, rate: Number(rateInput.value) || 0 };
  try {
    localStorage.setItem(key, JSON.stringify(data));
  } catch (e) {}
}

function render() {
  document.getElementById('month-label').textContent =
    current.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const year = current.getFullYear();
  const month = current.getMonth();
  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    const el = document.createElement('div');
    el.className = 'day-btn empty';
    grid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const btn = document.createElement('button');
    btn.textContent = day;
    btn.className = 'day-btn' + (marked[day] ? ' marked' : '');
    btn.addEventListener('click', () => {
      marked[day] = !marked[day];
      saveMonth();
      render();
    });
    grid.appendChild(btn);
  }

  const count = Object.values(marked).filter(Boolean).length;
  const rate = Number(rateInput.value) || 0;
  document.getElementById('days-count').textContent = count;
  document.getElementById('total').textContent = new Intl.NumberFormat().format(count * rate);
}

document.getElementById('prev-month').addEventListener('click', () => {
  current.setMonth(current.getMonth() - 1);
  loadMonth();
});
document.getElementById('next-month').addEventListener('click', () => {
  current.setMonth(current.getMonth() + 1);
  loadMonth();
});
rateInput.addEventListener('input', () => {
  saveMonth();
  render();
});

/* ===== VIEW SWITCHING ===== */
const tabs = document.querySelectorAll('.view-tab');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('tracker-view').style.display = currentView === 'tracker' ? 'block' : 'none';
    document.getElementById('summary-view').style.display = currentView === 'summary' ? 'block' : 'none';
    if (currentView === 'summary') renderSummary();
  });
});

/* ===== SUMMARY ===== */
function getAllMonthsData() {
  const months = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('transport-')) {
      try {
        const raw = localStorage.getItem(key);
        const data = JSON.parse(raw);
        const parts = key.replace('transport-', '').split('-');
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]);
        const date = new Date(year, month - 1, 1);
        const days = (data.days || []).length;
        const rate = data.rate || 0;
        months.push({
          key,
          date,
          label: date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }),
          days,
          rate,
          total: days * rate
        });
      } catch (e) {}
    }
  }
  return months.sort((a, b) => a.date - b.date);
}

function renderSummary() {
  const container = document.getElementById('summary-content');
  const months = getAllMonthsData();

  if (months.length === 0) {
    container.innerHTML = '<div class="empty-state">No data yet.<br>Go to Tracker and mark some days first.</div>';
    return;
  }

  let html = '<table class="summary-table"><thead><tr><th>Month</th><th class="num">Rate</th><th class="num">Days</th><th class="num">Total</th></tr></thead><tbody>';
  let grandTotal = 0;
  months.forEach(m => {
    grandTotal += m.total;
    html += `<tr>
      <td>${m.label}</td>
      <td class="num">${new Intl.NumberFormat().format(m.rate)}</td>
      <td class="num">${m.days}</td>
      <td class="num">${new Intl.NumberFormat().format(m.total)}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  html += `<div class="summary-total"><span class="label">Grand Total</span><span class="value">TZS ${new Intl.NumberFormat().format(grandTotal)}</span></div>`;
  container.innerHTML = html;
}

document.getElementById('clear-all-btn').addEventListener('click', () => {
  if (!confirm('Are you sure? This will delete ALL your transport data.')) return;
  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('transport-')) toRemove.push(key);
  }
  toRemove.forEach(k => localStorage.removeItem(k));
  renderSummary();
  loadMonth();
});

/* ===== PRINT / EXPORT ===== */
function populatePrintReport() {
  const months = getAllMonthsData();
  const tbody = document.getElementById('print-tbody');
  tbody.innerHTML = '';
  let grandTotal = 0;
  months.forEach(m => {
    grandTotal += m.total;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${m.label}</td><td>${new Intl.NumberFormat().format(m.rate)}</td><td class="num">${m.days}</td><td class="num">${new Intl.NumberFormat().format(m.total)}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('print-total').textContent = `Grand Total: TZS ${new Intl.NumberFormat().format(grandTotal)}`;
  document.getElementById('print-date').textContent = 'Generated on ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

document.getElementById('export-btn').addEventListener('click', () => {
  populatePrintReport();
  window.print();
});

document.getElementById('print-summary-btn').addEventListener('click', () => {
  populatePrintReport();
  window.print();
});

/* ===== DARK MODE ===== */
const themeToggle = document.getElementById('theme-toggle');
function setTheme(dark) {
  if (dark) {
    document.body.classList.add('dark');
    themeToggle.innerHTML = '&#9790;';
    document.getElementById('theme-meta').setAttribute('content', '#121212');
  } else {
    document.body.classList.remove('dark');
    themeToggle.innerHTML = '&#9788;';
    document.getElementById('theme-meta').setAttribute('content', '#185fa5');
  }
}

const savedTheme = localStorage.getItem('transport-theme');
if (savedTheme === 'dark') setTheme(true);
else if (savedTheme === 'light') setTheme(false);
else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);

themeToggle.addEventListener('click', () => {
  const isDark = document.body.classList.contains('dark');
  setTheme(!isDark);
  localStorage.setItem('transport-theme', !isDark ? 'dark' : 'light');
});

/* ===== INIT ===== */
loadMonth();

/* ===== SERVICE WORKER ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('SW registered'))
    .catch((err) => console.log('SW failed', err));
}

/* ===== INSTALL PROMPT ===== */
let deferredPrompt;
const installBanner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');
const dismissBtn = document.getElementById('dismiss-install');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') installBanner.classList.remove('show');
  deferredPrompt = null;
});

dismissBtn.addEventListener('click', () => {
  installBanner.classList.remove('show');
  localStorage.setItem('install-dismissed', Date.now().toString());
});

const dismissed = localStorage.getItem('install-dismissed');
if (dismissed && Date.now() - parseInt(dismissed) < 7 * 24 * 60 * 60 * 1000) {
  installBanner.classList.remove('show');
}
</script>

</body>
</html>
